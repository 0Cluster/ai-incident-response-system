# Prometheus configuration
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "airs-api"
    static_configs:
      - targets: ["api:8000"]
    metrics_path: /metrics
    scrape_timeout: 10s

  - job_name: "otel-collector"
    static_configs:
      - targets: ["otel-collector:9464"]
