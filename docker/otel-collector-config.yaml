# OpenTelemetry Collector configuration
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

exporters:
  logging:
    loglevel: debug
  prometheus:
    endpoint: 0.0.0.0:9464

processors:
  batch:
    timeout: 5s
    # send_batch_max_size must be >= send_batch_size. The default
    # send_batch_size is 8192, so set both explicitly.
    send_batch_size: 512
    send_batch_max_size: 1024

service:
  pipelines:
    # The prometheus exporter is metrics-only. Traces are currently
    # emitted to the collector log; add an OTLP trace backend if needed.
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [logging]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]
