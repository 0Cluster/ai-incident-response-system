server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy API calls to the Compose service. The frontend is built with a
    # relative VITE_API_URL (/api/v1), so browser requests stay same-origin.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React Router uses the History API. Unknown paths must serve the SPA
    # shell instead of a 404 when a user refreshes or opens a deep link.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
